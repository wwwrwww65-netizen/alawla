<html>
<head>
<meta http-equiv="refresh" content="2; url=$(link-orig)">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />   
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Internet hotspot - Advertisement</title>
<script>
    var popup = '';
    function openOrig() {
	if (window.focus) popup.focus();
	location.href = unescape('$(link-orig-esc)');
    }
    function openAd() {
	location.href = unescape('$(link-redirect-esc)');
    }
    function openAdvert() {
	if (window.name != 'hotspot_advert') {
		popup = open('$(link-redirect)', 'hotspot_advert', '');
		setTimeout("openOrig()", 1000);
		return;
	}
	setTimeout("openAd()", 1000);
    }
</script>
</head>
<body onLoad="openAdvert()">
    <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif;direction:rtl;">
        <div>
            <h2>إعلان الشبكة</h2>
            <p>إذا لم يتم تحويلك تلقائياً، اضغط <a href="$(link-redirect)" target="_blank">هنا للمتابعة</a>.</p>
        </div>
    </div>
</body>
</html>
