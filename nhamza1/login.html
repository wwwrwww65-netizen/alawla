    <!-- سكربت جلب البيانات والتهيئة الأساسية -->
    <script>
      "use strict";
      var globalBtnColor = "#6366f1"; 

      (function () {
        function getJSON(url, onOk, onErr) {
          try {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function () {
              if (xhr.readyState === 4) {
                if (xhr.status >= 200 && xhr.status < 300) {
                  try { onOk(JSON.parse(xhr.responseText)); } catch (e) { if (onErr) onErr(e); }
                } else { if (onErr) onErr(new Error("HTTP " + xhr.status)); }
              }
            };
            xhr.send();
          } catch (e) { if (onErr) onErr(e); }
        }
        function safeTrim(s) { if (s === null || s === undefined) return ""; return String(s).replace(/^\s+|\s+$/g, ""); }
        function setText(id, text) { var el = document.getElementById(id); if (el != null) el.textContent = text; }

        function fillList(id, items) {
          var el = document.getElementById(id); if (!el) return;
          items = Array.isArray(items) ? items : [];
          var html = "";
          for (var i = 0; i < items.length; i++) {
            var val = safeTrim(items[i]);
            if(val && val.toLowerCase() !== 'n' && val.toLowerCase() !== 'hh') {
              html += "<li class='bg-white/5 p-2 rounded-lg border border-white/10 mb-1'>" + val + "</li>";
            }
          }
          if (!html) { el.innerHTML = "<li class='text-center opacity-40 py-2'>لا توجد نقاط بيع حالياً</li>"; return; }
          el.innerHTML = html;
        }

        function fillPricesTable(items) {
          var tbody = document.getElementById("pricesList"); if (!tbody || !items) return;
          var rows = "";
          for (var i = 0; i < items.length; i++) {
            var r = items[i];
            if(safeTrim(r.category) && safeTrim(r.category).toLowerCase() !== 'hh' && safeTrim(r.time)) {
              rows += "<tr class='hover:bg-white/5 transition-colors'>" + 
                      '<td class="py-2 px-2 border-l border-white/5 font-bold text-amber-400">' + r.category + "</td>" + 
                      '<td class="py-2 px-2 border-l border-white/5">' + r.time + "</td>" + 
                      '<td class="py-2 px-2 border-l border-white/5 text-emerald-400">' + r.amount + "</td>" + 
                      '<td class="py-2 px-2">' + r.validity + "</td>" + 
                      "</tr>";
            }
          }
          tbody.innerHTML = rows;
        }

        function fillSpeedOptions(config) {
          var select = document.getElementById("speedOptions"); if (!select || !config || !config.speedOptions) return;
          while (select.firstChild) select.removeChild(select.firstChild);
          var defValue = config.defaultSpeed || "";
          for (var i = 0; i < config.speedOptions.length; i++) {
            var s = config.speedOptions[i];
            if(safeTrim(s.label) && safeTrim(s.label).toLowerCase() !== 'hh' && safeTrim(s.value)) {
              var opt = document.createElement("option"); opt.value = s.value; opt.text = s.label;
              if (defValue && s.value === defValue) opt.selected = true;
              select.appendChild(opt);
            }
          }
        }

        function applyColors(config) {
          var bg = config.backgroundColor || "linear-gradient(135deg, #0f0c1b 0%, #1a103c 50%, #0d0626 100%)";
          var txt = config.textColor || "#ffffff";
          var formBg = config.formBgColor || "rgba(255, 255, 255, 0.04)";
          globalBtnColor = config.primaryButtonColor || "#6366f1";
          
          var css = "";
          css += "body { background: " + bg + " !important; }";
          css += "#mainCard { background: " + formBg + " !important; }";
          
          css += "#marqueeWrapper, input[type='text']#cardNumber, input[type='tel']#cardNumber, select#speedOptions, #savedCards, .updates-wrapper, select { background: " + bg + " !important; }";
          
          // تطبيق لون الخط الديناميكي بشكل شامل على كل عناصر النوافذ المنبثقة والجداول والقوائم
          css += "body, h1, h2, h3, p, label, span, table, tr, td, th, ul, li, div, select#speedOptions { color: " + txt + " !important; }";
          css += "#submitBtn, .action-btns button, .modal-box button { background-color: " + globalBtnColor + " !important; color: " + txt + " !important; font-weight: 800 !important; }";
          
          // ربط ذكي لتطبيق لون الخلفية والخط المجلوب من لوحة التحكم على النوافذ المنبثقة
          css += ".modal-box { background: " + bg + " !important; color: " + txt + " !important; }";
          
          css += "#themeLogo { filter: drop-shadow(0px 0px 1px " + globalBtnColor + ") brightness(1.2) !important; }";
          css += "#cardNumber::placeholder { color: " + txt + " !important; opacity: 0.6 !important; }";
          css += "#cardNumber { color: " + txt + " !important; }";

          css += "select#speedOptions option { background-color: " + (config.formBgColor && config.formBgColor.indexOf('rgba') === 0 ? '#1a103c' : formBg) + " !important; color: " + txt + " !important; }";

          if (config.marqueeTextColor) {
            css += "#marquee { color: " + config.marqueeTextColor + " !important; }";
          } else {
            css += "#marquee { color: " + txt + " !important; }"; 
          }
          
          css += "td.text-amber-400 { color: #f59e0b !important; }";
          css += "td.text-emerald-400 { color: #10b981 !important; }";

          var hiddenInput = document.getElementById("updatesValue");
          if(hiddenInput && hiddenInput.value !== "0|pm|all|*yes**|non***") {
              css += ".toggle-switch.on { background-color: " + globalBtnColor + " !important; }";
          }
          
          var styleEl = document.getElementById("dynamicStyles");
          if (styleEl) {
            try { styleEl.textContent = css; } catch (e) { styleEl.innerHTML = css; }
          }
        }

        function loadConfig() {
          getJSON("config.json", function (config) {
            setText("title", config.title || "شبكة الواي فاي");
            setText("marquee", config.marqueeText);
            setText("support", "خدمة العملاء: " + (config.supportNumbers || []).join(" - "));
            setText("manager", config.managerNote);
            try { setText("date", new Date().toLocaleDateString("ar-YE", { weekday: "long", day: "numeric", month: "long", year: "numeric" })); } catch (e) { setText("date", new Date().toDateString()); }

            applyColors(config); 
            fillSpeedOptions(config);
            
            var input = document.getElementById("cardNumber");
            if (input && config.cardInputType === "number") {
                input.type = "tel"; input.inputMode = "numeric";
                input.oninput = function () { input.value = input.value.replace(/[^\d]/g, ""); };
            }

            var modal = document.getElementById("adminAlertModal");
            var alertBox = document.getElementById("adminAlert");
            if (modal && alertBox) {
              var msg = safeTrim(config.statusAlert || "");
              if (msg) { alertBox.textContent = msg; modal.classList.remove("hidden"); }
            }

            fillPricesTable(config.prices);
            fillList("salesList", config.salesPoints);
            
            var wrapper = document.querySelector("#slider .swiper-wrapper");
            var sliderCont = document.getElementById("sliderContainer");
            if (wrapper && sliderCont && config.cardImageSlider && config.cardImageSlider.length > 0) {
              sliderCont.classList.remove("hidden");
              var slides = "";
              for (var i = 0; i < config.cardImageSlider.length; i++) {
                var src = config.cardImageSlider[i];
                if (!/^https?:\/\//i.test(src) && src.indexOf("img/") !== 0) { src = "img/" + src; }
                slides += '<div class="swiper-slide">' + '<img src="' + src + '" class="rounded-xl w-full h-32 object-cover" />' + "</div>";
              }
              wrapper.innerHTML = slides;
              if (window.Swiper) {
                try { new Swiper("#slider", { loop: true, autoplay: { delay: 3000 }, navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" } }); } catch (e) {}
              }
            }
          }, function (err) { if (window.console) console.error(err); });
        }

        window.openModal = function (id) { var el = document.getElementById(id); if (el) el.classList.remove("hidden"); };
        window.closeModal = function (id) { var el = document.getElementById(id); if (el) el.classList.add("hidden"); };
        if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", loadConfig); } else { loadConfig(); }
      })();
    </script>
    
    <!-- سكربت إدارة الكروت المحفوظة وحالة التحديثات -->
    <script>
      "use strict";
      function safeTrim(s) { if (s === null || s === undefined) return ""; return String(s).replace(/^\s+|\s+$/g, ""); }
      function safeGetSavedCards() { try { var raw = localStorage.getItem("savedCards"); if (!raw) return []; var parsed = JSON.parse(raw); return parsed && parsed.length ? parsed : []; } catch (e) { return []; } }
      function safeSetSavedCards(cards) { try { localStorage.setItem("savedCards", JSON.stringify(cards)); } catch (e) {} }
      
      function saveCard() {
        var cardInput = document.getElementById("cardNumber"); if (!cardInput) return;
        var card = safeTrim(cardInput.value); if (!card) return;
        var cards = safeGetSavedCards(); var filtered = [];
        for (var i = 0; i < cards.length; i++) { if (cards[i] !== card) filtered.push(cards[i]); }
        cards = filtered; cards.unshift(card);
        if (cards.length > 5) cards = cards.slice(0, 5);
        safeSetSavedCards(cards);
      }
      
      window.toggleSaved = function(event) {
        if(event) event.stopPropagation(); 
        var container = document.getElementById("savedCards"); if (!container) return;
        container.innerHTML = ""; var cards = safeGetSavedCards();
        
        if(!cards.length){ 
          container.classList.add("hidden"); 
          return;
        } 
        else {
          for (var i = 0; i < cards.length; i++) {
            (function (c) {
              var div = document.createElement("div"); div.textContent = c;
              div.className = "saved-card-item";
              div.onclick = function () { var input = document.getElementById("cardNumber"); if (input) input.value = c; container.classList.add("hidden"); };
              container.appendChild(div);
            })(cards[i]);
          }
          container.classList.toggle("hidden");
        }
      }

      document.addEventListener("click", function(event) {
          var container = document.getElementById("savedCards");
          var btn = document.querySelector(".saved-btn-cls");
          if (container && !container.classList.contains("hidden") && event.target !== container && event.target !== btn && !container.contains(event.target)) {
              container.classList.add("hidden");
          }
      });

      (function bindSaveCard() {
        var form = document.querySelector("form[name='login']"); if (!form) return;
        form.addEventListener("submit", saveCard);
      })();

      function setUpdatesUI(isBlocked) {
        var hidden = document.getElementById("updatesValue"); var toggle = document.getElementById("updatesToggleBtn");
        var offText = document.getElementById("updatesOffText"); var onText = document.getElementById("updatesOnText");
        if (!hidden || !toggle) return;
        
        if (isBlocked) {
          hidden.value = "0|pm|all|*yes**|non***"; 
          toggle.classList.remove("on"); 
          toggle.style.backgroundColor = "rgba(255, 255, 255, 0.15)";
          if(offText) offText.classList.add("active"); 
          if(onText) onText.classList.remove("active");
        } else {
          hidden.value = "0|pm|all|*no**|non***"; 
          toggle.classList.add("on"); 
          toggle.style.backgroundColor = typeof globalBtnColor !== 'undefined' ? globalBtnColor : "#6366f1";
          if(onText) onText.classList.add("active"); 
          if(offText) offText.classList.remove("active");
        }
      }
      
      window.toggleUpdates = function() { 
        var hidden = document.getElementById("updatesValue");
